<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Kapellen 1919 e.V. 3 - MF Kaderplanung</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --navy: #050a14;
            --gold: #D4AF37;
            --gold-dim: rgba(212, 175, 55, 0.1);
            --white: #ffffff;
            --card-bg: #0c1626;
            --accent-blue: #0074D9;
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
            --zusage: #10b981;
            --absage: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000; color: var(--text-main); font-family: 'Lato', sans-serif; padding: 20px; }
        
        .container {
            background-color: var(--navy);
            border: 1px solid var(--gold-dim);
            border-radius: 12px;
            padding: 30px;
            max-width: 900px;
            margin: 0 auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        h2 { font-family: 'Poppins', sans-serif; color: var(--gold); text-align: center; margin-top: 0; font-size: 1.8rem; margin-bottom: 20px; }
        
        .role-box {
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid var(--gold);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
            color: var(--gold);
            font-size: 1.1rem;
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 6px; font-weight: bold; letter-spacing: 1px; }
        input, select { width: 100%; padding: 12px; background: #000; border: 1px solid #333; border-radius: 6px; color: white; font-size: 1rem; }
        input:focus, select:focus { border-color: var(--gold); outline: none; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: var(--card-bg); border-radius: 8px; overflow: hidden; }
        th, td { border: 1px solid rgba(255,255,255,0.05); padding: 10px; text-align: center; font-size: 0.95rem; }
        th { background: rgba(255,255,255,0.03); color: var(--gold); font-family: 'Poppins'; text-transform: uppercase; font-size: 0.8rem; }
        
        .block-header { background: rgba(212, 175, 55, 0.15); color: var(--gold); text-align: left; padding: 10px 15px; font-weight: bold; font-family: 'Poppins'; }
        
        .save-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            background: var(--gold);
            color: #000;
            margin-top: 25px;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: opacity 0.2s;
        }
        .save-btn:hover { opacity: 0.9; }

        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover { color: var(--gold); }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Zurück zum Haupt-Dashboard</a>
    <h2>TV Kapellen 1919 e.V. 3<br><span style="font-size: 1.1rem; color: var(--text-dim);">MF Kaderplanung (8 Einzel / 4 Doppel)</span></h2>
    
    <div class="role-box" id="roleDisplay">Eingeloggt als: Lade...</div>

    <div class="grid-2">
        <div class="form-group">
            <label>Spieltag Nummer</label>
            <input type="number" id="spieltagNummer" value="1" min="1" max="22">
        </div>
        <div class="form-group">
            <label>Gegnerische Mannschaft</label>
            <input type="text" id="gegnerName" placeholder="z.B. DSC Goch 3">
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 100px;">Spiel #</th>
                <th>Heim Spieler (TV Kapellen 3)</th>
                <th>Gast Spieler (Gegner)</th>
            </tr>
        </thead>
        <tbody id="matchTableBody">
            <!-- Wird dynamisch gefüllt -->
        </tbody>
    </table>

    <button class="save-btn" onclick="saveMyAufstellung()">Aufstellung im Sheet speichern</button>
</div>

<script>
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwDn_d9o-RWGVFUENrs3ZubfFHPvo2SSKzy0bY0uw4avjngv9l0zgfVDop5cfcm6AgKHg/exec';
    
    // Holt den aktuell eingeloggten Benutzer aus dem localStorage
    let currentUser = localStorage.getItem('tvk3_user_26_27_mobile') || "Jürgen Schützendorf";
    const cleanUser = currentUser.replace(' (TC 1)', '').replace(' (MF1)', '').replace(' (MF2)', '').trim();
    
    document.getElementById('roleDisplay').innerHTML = `Eingeloggt als: <span style="color:#fff;">${cleanUser}</span>`;

    const ourTeamRoster = [
        "Jürgen Schützendorf", "Markus Ginsel", "Lars Neutag", "Ludger Schledorn", 
        "Andreas Denner", "Niklas Weichert", "Dominik Helmke", "Markus Lenz", 
        "Thomas Kliver", "Wolfram Senger", "Michael Müller", "Florian Hartwich"
    ];

    function buildMinimalTable() {
        const tbody = document.getElementById('matchTableBody');
        tbody.innerHTML = '';

        // Block 1: Einzel (1 - 8)
        const headerE = document.createElement('tr');
        headerE.innerHTML = `<td colspan="3" class="block-header">Block 1: Einzel (1 - 8)</td>`;
        tbody.appendChild(headerE);

        for(let i = 1; i <= 8; i++) {
            tbody.appendChild(createRow(`Einzel ${i}`, i));
        }

        // Block 2: Doppel (1 - 4)
        const headerD = document.createElement('tr');
        headerD.innerHTML = `<td colspan="3" class="block-header">Block 2: Doppel (1 - 4)</td>`;
        tbody.appendChild(headerD);

        for(let i = 1; i <= 4; i++) {
            tbody.appendChild(createRow(`Doppel ${i}`, i + 8));
        }
    }

    function createRow(label, index) {
        const tr = document.createElement('tr');
        
        let optionsHeim = '<option value="">-- Unser Spieler wählen --</option>';
        ourTeamRoster.forEach(p => { optionsHeim += `<option value="${p}">${p}</option>`; });

        tr.innerHTML = `
            <td><b>${label}</b></td>
            <td><select id="heim_${index}">${optionsHeim}</select></td>
            <td><input type="text" id="gast_${index}" placeholder="Name des Gegners"></td>
        `;
        return tr;
    }

    function saveMyAufstellung() {
        let matchData = [];
        // 8 Einzel + 4 Doppel = 12 Spiele insgesamt
        for(let i = 1; i <= 12; i++) {
            matchData.push({
                spiel: i <= 8 ? `Einzel ${i}` : `Doppel ${i-8}`,
                heim: document.getElementById(`heim_${i}`).value,
                gast: document.getElementById(`gast_${i}`).value
            });
        }

        const payloadData = {
            spieltag: document.getElementById('spieltagNummer').value,
            gegner: document.getElementById('gegnerName').value,
            aufstellung: matchData
        };

        // Übertragung via Image-Hack (GET-Parameter), um jegliche CORS/Redirect-Blockaden zu umgehen
        const url = new URL(GOOGLE_SCRIPT_URL);
        url.searchParams.append("action", "saveNwdvAufstellung");
        url.searchParams.append("spieler", cleanUser);
        url.searchParams.append("spieltag", document.getElementById('spieltagNummer').value);
        url.searchParams.append("payload", JSON.stringify(payloadData));

        const img = new Image();
        img.src = url.toString();

        alert("Aufstellung für Spieltag " + document.getElementById('spieltagNummer').value + " wurde erfolgreich an das Google Sheet gesendet!");
    }

    buildMinimalTable();
</script>
</body>
</html>
