<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NWDV Spielbericht Typ A - TV Kapellen 3</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --success: #22c55e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 1150px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h2 { color: var(--accent); text-align: center; margin-top: 0; font-size: 1.5rem; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; font-weight: 600; }
        input, select { width: 100%; padding: 8px 10px; background: #0f172a; border: 1px solid var(--border-color); border-radius: 6px; color: white; box-sizing: border-box; font-size: 0.9rem; }
        input:focus, select:focus { outline: 1px solid var(--accent); }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.85rem; table-layout: fixed; }
        th, td { border: 1px solid var(--border-color); padding: 6px 4px; text-align: center; }
        th { background: #0f172a; color: var(--accent); white-space: nowrap; }
        
        .score-container { display: flex; align-items: center; justify-content: center; gap: 6px; }
        .score-input { width: 42px !important; padding: 4px; text-align: center; font-weight: bold; font-size: 0.95rem; }
        .pass-input { text-align: center; font-size: 0.8rem; }
        
        .running-score { font-weight: bold; color: var(--success); font-size: 0.95rem; }
        .summary-row { background-color: #0f172a; font-weight: bold; color: var(--accent); }
        .final-row { background-color: #1e3a8a; font-weight: bold; color: #ffffff; font-size: 1rem; }
        
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; background: var(--success); color: white; margin-top: 20px; font-size: 1.05rem; }
        button:hover { opacity: 0.9; }
        .btn-blue { background: var(--accent); }
        .block-header { background: #334155; color: #fff; text-align: left; padding: 8px 12px; font-weight: bold; margin-top: 20px; border-radius: 4px; }
        hr { border: 0; border-top: 1px solid var(--border-color); margin: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>NWDV Ligaspielbericht "Typ A" - TV Kapellen 3</h2>

    <!-- Archiv / Laden-Sektion -->
    <div class="form-group" style="background: #0f172a; padding: 12px 15px; border-radius: 8px; border: 1px solid var(--border-color);">
        <label style="color: var(--accent);">Gespeicherten Spielbericht ansehen</label>
        <div style="display:flex; gap: 12px;">
            <select id="savedReportsSelect" onchange="loadSelectedReport()">
                <option value="">Lade gespeicherte Berichte...</option>
            </select>
            <button class="btn-blue" style="width: auto; margin-top: 0; white-space: nowrap;" onclick="resetForm()">Neuer Bericht</button>
        </div>
    </div>

    <hr>
    
    <!-- Spielort & Spieltag Schnellauswahl -->
    <div class="grid-2">
        <div class="form-group" style="background: #1e293b; padding: 10px; border: 1px solid var(--accent); border-radius: 6px;">
            <label style="color: var(--accent);">Heim / Auswärts</label>
            <select id="matchType" onchange="toggleHomeAway()">
                <option value="Heim">Heimspiel</option>
                <option value="Auswärts">Auswärtsspiel</option>
            </select>
        </div>
        <div class="form-group" style="background: #1e293b; padding: 10px; border: 1px solid var(--accent); border-radius: 6px;">
            <label style="color: var(--accent);">Spieltag Auswählen</label>
            <select id="scheduleSelect" onchange="applyScheduleSelection()">
                <option value="">-- Spieltag wählen --</option>
            </select>
        </div>
    </div>

    <div class="grid-4">
        <div class="form-group"><label>Datum</label><input type="date" id="datum"></div>
        <div class="form-group"><label>Spieltag</label><input type="number" id="spieltag" value="1"></div>
        <div class="form-group"><label>Liga</label><input type="text" id="liga" value="NWDV Liga A"></div>
        <div class="form-group"><label>Spielort</label><input type="text" id="spielort" value="Vereinsheim"></div>
    </div>
    
    <div class="grid-2">
        <div class="form-group"><label id="labelTeamHeim">Heimmannschaft</label><input type="text" id="teamHeim" value="TV Kapellen 3"></div>
        <div class="form-group">
            <label id="labelTeamGast">Gastmannschaft</label>
            <select id="teamGast" onchange="updateDropdownRosters()">
                <option value="">-- Gegner wählen --</option>
            </select>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 30px;">#</th>
                <th style="width: 90px;">Pass Heim</th>
                <th style="width: 200px;">Heim Spieler</th>
                <th style="width: 90px;">Pass Gast</th>
                <th style="width: 200px;">Gast Spieler</th>
                <th style="width: 110px;">Legs</th>
                <th style="width: 90px;">Zw. Legs</th>
                <th style="width: 90px;">Zw. Spiele</th>
            </tr>
        </thead>
        <tbody id="matchTableBody"></tbody>
    </table>

    <div class="block-header">Bestleistungen</div>
    <div class="grid-2" style="margin-top: 10px;">
        <div class="form-group"><label>Highscore (180)</label><input type="text" id="blHighscore" placeholder="Spieler Name(n)"></div>
        <div class="form-group"><label>Highfinish (100+)</label><input type="text" id="blHighfinish" placeholder="z.B. 120 (Max)"></div>
        <div class="form-group"><label>Shortgame Einzel</label><input type="text" id="blShortEinzel" placeholder="z.B. 15 Darts"></div>
        <div class="form-group"><label>Shortgame Doppel</label><input type="text" id="blShortDoppel" placeholder="z.B. 18 Darts"></div>
    </div>

    <button onclick="saveReport()">Spielbericht Speichern</button>
</div>

<script>
    const SHEET_NAME = "TV Kapellen 3"; 
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzueR2jiTn74LbqOzWqAHrregerQnnjjuAfJsMQTty2KHj1i4oIdrz1xu4ewXRgj_cGHA/exec";

    const schedule = {
        "2026-09-05": "DSC Goch 3",
        "2026-09-19": "DSC Goch 4",
        "2026-09-26": "Die Wardter Darter",
        "2026-10-10": "Hart am Draht",
        "2026-10-24": "Rumelner TV 3",
        "2026-11-07": "SV Menzelen 1925",
        "2026-11-14": "TV Kapellen 1919 e.V. 2",
        "2026-11-28": "The Red Lions Xanten 1",
        "2027-01-09": "Triple Inn Issum 2"
    };

    const opponentRosters = {
        "DSC Goch 3": ["Lucas Keisers", "Patryk Tajdus", "Juri Lambert", "Jannik Lommen", "Manfred Michels", "Xavier Tomalla", "Björn Janssen", "Antoni Rolniczak", "Jonas Neiling", "Tim Knops", "Sven Stiebing", "Lennart Upmeyer", "Lukas Kerst", "Sebastian Wouters", "Linus Kerst", "Michael Loock"],
        "DSC Goch 4": ["Jens Robert Michels", "Ben Schweidler", "Patrick Thellmann", "Andreas Geurtsen", "Alexander Schmidt", "Mario van Elst", "Melanie Zwanziger", "Kevin van Elst", "Tobias Klamp", "Hans Günther Seidl", "Marco Hofkens", "Maximilian Henn", "Jörg Hillmann", "Michael Schweidler", "Hans-Jürgen Otto", "Adrian Hoppe", "Justus Kilzer", "Holger Stayen", "Niklas Krämer"],
        "Die Wardter Darter": ["Alexander Reis", "Narayan Amanupunnjo", "Marvin Loth", "Ralf Graumann", "Christian Dederle", "Daniel Venhoff", "Marius Bußmann", "Rainer Staymann", "Martin Wegner", "Timo von Scheidt", "André Kaufels"],
        "Hart am Draht": ["Ann-Kathrin Brugmann", "Justin Schraven", "Leandro Wessiepe", "Pierre Lohmann", "Marius Hergesell", "Kevin Haßheider", "Henning Felder", "Annkathrin Wanders", "Saskia Husmann", "Benjamin Borgards", "Philipp-Sascha Brugmann", "Stefan Borgards", "Marco Inghilleri", "Melanie Bendriss", "Manuela Weis", "Robin Weis", "Michael Ganther", "Thomas Zygar"],
        "Rumelner TV 3": ["Michaela von Dahlen", "Christian Krause", "Stefan Eilbrecht", "Sebastian Pohl", "Pierre von Dahlen", "Marvin Fünfstück", "Valentin De Spirt", "Alexander Wahl", "Melanie Drees", "Mike Küffen", "Sam von Dahlen", "Sascha Schütte"],
        "SV Menzelen 1925": ["Iris Reimer", "Julian Keisers", "Erich Janik", "Martin Haberstroh", "Johannes Wynen", "Thomas Kiwitt", "Robert Giesen", "Christoph Luschgy", "Tanja Wynen", "Sven Krams", "Stephan Kempkes", "Daniel Kempkes", "Markus Reimer"],
        "TV Kapellen 1919 e.V. 2": ["Philip Möller", "Markus Thiele", "Danny Voß", "Daniel Simanowitz", "Christian Schreiber", "Dominik Herz", "Markus Elgersma", "Thomas Franzen"],
        "The Red Lions Xanten 1": ["Sebastian ALosery", "Jan Pötters", "Stephan Reintges", "Raphael Wefers", "Kai Maas", "Dustin Stenzel", "Tobias Reintges", "Björn Hesse"],
        "Triple Inn Issum 2": ["Lukas Helmes", "Sarah Hillejan", "Simon Hillejan", "Thomas Liebenow", "Marcel Angenendt", "Hans-Willi Hollick", "Joshua Jäschke", "Stefan Hanauer", "Michael Heinen", "Stefan Klein", "Christoph Passens", "Karl-Heinz Grimm", "Daniel Moschüring", "Michael Delbeck", "Sascha Rudies"]
    };

    const myTeamRoster = [
        "Jürgen Schützendorf", "Markus Ginsel", "Lars Neutag", "Ludger Schledorn", "Andreas Denner", "Niklas Weichert", "Dominik Helmke", "Markus Lenz", "Thomas Kliver", "Wolfram Senger", "Michael Müller", "Florian Hartwich"
    ];

    const totalMatches = 20;
    let allReports = [];

    function initForm() {
        populateScheduleSelect();
        populateGastTeamsSelect();
        buildTable();
        loadReportsFromSheet();
    }

    function populateScheduleSelect() {
        const scheduleSelect = document.getElementById('scheduleSelect');
        let index = 1;
        for (const [date, team] of Object.entries(schedule)) {
            const option = document.createElement('option');
            option.value = date;
            option.dataset.spieltag = index;
            option.dataset.team = team;
            option.textContent = `Spieltag ${index} (${date}): vs. ${team}`;
            scheduleSelect.appendChild(option);
            index++;
        }
    }

    function populateGastTeamsSelect() {
        const teamGastSelect = document.getElementById('teamGast');
        for (const team of Object.keys(opponentRosters)) {
            const option = document.createElement('option');
            option.value = team;
            option.textContent = team;
            teamGastSelect.appendChild(option);
        }
    }

    function toggleHomeAway() {
        const isAway = document.getElementById('matchType').value === "Auswärts";
        const teamHeimInput = document.getElementById('teamHeim');
        const opponentTeam = document.getElementById('teamGast').value;

        if (isAway) {
            teamHeimInput.value = opponentTeam || "Gegner";
            document.getElementById('spielort').value = "Auswärts";
        } else {
            teamHeimInput.value = "TV Kapellen 3";
            document.getElementById('spielort').value = "Vereinsheim";
        }
        updateDropdownRosters();
    }

    function applyScheduleSelection() {
        const scheduleSelect = document.getElementById('scheduleSelect');
        const selectedOption = scheduleSelect.options[scheduleSelect.selectedIndex];
        
        if (!selectedOption.value) return;

        document.getElementById('datum').value = selectedOption.value;
        document.getElementById('spieltag').value = selectedOption.dataset.spieltag;
        document.getElementById('teamGast').value = selectedOption.dataset.team;

        toggleHomeAway();
    }

    function buildTable() {
        const tbody = document.getElementById('matchTableBody');
        tbody.innerHTML = '';

        for (let i = 1; i <= totalMatches; i++) {
            if (i === 1) addBlockHeader(tbody, "Block 1: Einzel (1 - 8)");
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b>${i}</b></td>
                <td><input type="text" class="pass-input" id="passHeim_${i}" placeholder="Pass"></td>
                <td><select id="pHeim_${i}"><option value="">-- Spieler --</option></select></td>
                <td><input type="text" class="pass-input" id="passGast_${i}" placeholder="Pass"></td>
                <td><select id="pGast_${i}"><option value="">-- Spieler --</option></select></td>
                <td>
                    <div class="score-container">
                        <input type="number" class="score-input" id="lHeim_${i}" min="0" oninput="calculateScores()">
                        <span>:</span>
                        <input type="number" class="score-input" id="lGast_${i}" min="0" oninput="calculateScores()">
                    </div>
                </td>
                <td class="running-score" id="zsLegs_${i}">-</td>
                <td class="running-score" id="zsSpstd_${i}">-</td>
            `;
            tbody.appendChild(tr);

            // Zwischenstände & Endstand Zeilen
            if (i === 8) {
                addSummaryRow(tbody, "zwischenstand_block1", "Zwischenstand nach Einzel Block 1 (Spiele 1-8)");
                addBlockHeader(tbody, "Block 2: Doppel (9 - 12)");
            }
            if (i === 12) {
                addSummaryRow(tbody, "zwischenstand_block2", "Zwischenstand nach Doppel Block 2 (Spiele 1-12)");
                addBlockHeader(tbody, "Block 3: Einzel (13 - 20)");
            }
            if (i === 20) {
                addSummaryRow(tbody, "endstand_block3", "ENDSTAND (Spiele 1-20)", true);
            }
        }
        updateDropdownRosters();
    }

    function addBlockHeader(tbody, text) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td colspan="8" style="background:#1e293b; text-align:left; font-weight:bold; color:#3b82f6;">${text}</td>`;
        tbody.appendChild(tr);
    }

    function addSummaryRow(tbody, idPrefix, title, isFinal = false) {
        const tr = document.createElement('tr');
        tr.className = isFinal ? "final-row" : "summary-row";
        tr.innerHTML = `
            <td colspan="5" style="text-align:right; padding-right:15px;">${title}:</td>
            <td id="${idPrefix}_legs">-</td>
            <td colspan="2" id="${idPrefix}_spiele">-</td>
        `;
        tbody.appendChild(tr);
    }

    function updateDropdownRosters() {
        const isAway = document.getElementById('matchType').value === "Auswärts";
        const selectedOpponent = document.getElementById('teamGast').value;
        const opponentRoster = opponentRosters[selectedOpponent] || [];

        const heimRoster = isAway ? opponentRoster : myTeamRoster;
        const gastRoster = isAway ? myTeamRoster : opponentRoster;

        for (let i = 1; i <= totalMatches; i++) {
            populateSelect(document.getElementById(`pHeim_${i}`), heimRoster);
            populateSelect(document.getElementById(`pGast_${i}`), gastRoster);
        }
    }

    function populateSelect(selectEl, roster) {
        const currVal = selectEl.value;
        selectEl.innerHTML = '<option value="">-- Spieler wählen --</option>';
        roster.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p;
            opt.textContent = p;
            selectEl.appendChild(opt);
        });
        if (roster.includes(currVal)) selectEl.value = currVal;
    }

    function calculateScores() {
        let cumHeimLegs = 0, cumGastLegs = 0;
        let cumHeimGames = 0, cumGastGames = 0;

        for (let i = 1; i <= totalMatches; i++) {
            const hLegsVal = document.getElementById(`lHeim_${i}`).value;
            const gLegsVal = document.getElementById(`lGast_${i}`).value;

            if (hLegsVal !== '' && gLegsVal !== '') {
                const hLegs = parseInt(hLegsVal, 10) || 0;
                const gLegs = parseInt(gLegsVal, 10) || 0;

                cumHeimLegs += hLegs;
                cumGastLegs += gLegs;

                if (hLegs > gLegs) cumHeimGames += 1;
                else if (gLegs > hLegs) cumGastGames += 1;

                document.getElementById(`zsLegs_${i}`).textContent = `${cumHeimLegs} : ${cumGastLegs}`;
                document.getElementById(`zsSpstd_${i}`).textContent = `${cumHeimGames} : ${cumGastGames}`;
            } else {
                document.getElementById(`zsLegs_${i}`).textContent = `-`;
                document.getElementById(`zsSpstd_${i}`).textContent = `-`;
            }

            // Zwischenstände aktualisieren
            if (i === 8) {
                document.getElementById('zwischenstand_block1_legs').textContent = `${cumHeimLegs} : ${cumGastLegs}`;
                document.getElementById('zwischenstand_block1_spiele').textContent = `${cumHeimGames} : ${cumGastGames}`;
            }
            if (i === 12) {
                document.getElementById('zwischenstand_block2_legs').textContent = `${cumHeimLegs} : ${cumGastLegs}`;
                document.getElementById('zwischenstand_block2_spiele').textContent = `${cumHeimGames} : ${cumGastGames}`;
            }
            if (i === 20) {
                document.getElementById('endstand_block3_legs').textContent = `${cumHeimLegs} : ${cumGastLegs}`;
                document.getElementById('endstand_block3_spiele').textContent = `${cumHeimGames} : ${cumGastGames}`;
            }
        }
    }

    async function loadReportsFromSheet() {
        const selectEl = document.getElementById('savedReportsSelect');
        try {
            const res = await fetch(WEB_APP_URL);
            allReports = await res.json();

            selectEl.innerHTML = '<option value="">-- Spielbericht auswählen zum Ansehen --</option>';

            if (allReports && allReports.length > 0) {
                allReports.forEach((report, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    const d = report.datum ? report.datum.substring(0, 10) : 'Kein Datum';
                    option.textContent = `Spieltag ${report.spieltag} (${d}): ${report.heim} vs. ${report.gast} (${report.endstandSpiele})`;
                    selectEl.appendChild(option);
                });
            } else {
                selectEl.innerHTML = '<option value="">Keine gespeicherten Berichte vorhanden</option>';
            }
        } catch (e) {
            console.error("Fehler beim Laden:", e);
            selectEl.innerHTML = '<option value="">Fehler beim Laden der Berichte</option>';
        }
    }

    function loadSelectedReport() {
        const idx = document.getElementById('savedReportsSelect').value;
        if (idx === "") return;

        const report = allReports[idx];
        if (!report) return;

        if (report.datum) document.getElementById('datum').value = report.datum.substring(0, 10);
        document.getElementById('spieltag').value = report.spieltag || 1;
        document.getElementById('liga').value = report.liga || '';
        document.getElementById('spielort').value = report.spielort || '';
        document.getElementById('teamHeim').value = report.heim || '';
        document.getElementById('teamGast').value = report.gast || '';

        updateDropdownRosters();

        if (report.matches && report.matches.length > 0) {
            report.matches.forEach((m, index) => {
                const i = index + 1;
                document.getElementById(`passHeim_${i}`).value = m.passHeim || '';
                document.getElementById(`pHeim_${i}`).value = m.pHeim || '';
                document.getElementById(`passGast_${i}`).value = m.passGast || '';
                document.getElementById(`pGast_${i}`).value = m.pGast || '';
                document.getElementById(`lHeim_${i}`).value = m.lHeim || '';
                document.getElementById(`lGast_${i}`).value = m.lGast || '';
            });
            calculateScores();
        }

        if (report.bestleistungen) {
            document.getElementById('blHighscore').value = report.bestleistungen.highscore || '';
            document.getElementById('blHighfinish').value = report.bestleistungen.highfinish || '';
            document.getElementById('blShortEinzel').value = report.bestleistungen.shortEinzel || '';
            document.getElementById('blShortDoppel').value = report.bestleistungen.shortDoppel || '';
        }
    }

    function resetForm() {
        document.getElementById('savedReportsSelect').value = '';
        document.getElementById('scheduleSelect').value = '';
        document.getElementById('matchType').value = 'Heim';
        document.getElementById('datum').value = '';
        document.getElementById('spieltag').value = '1';
        document.getElementById('spielort').value = 'Vereinsheim';
        document.getElementById('teamGast').value = '';

        toggleHomeAway();

        for (let i = 1; i <= totalMatches; i++) {
            document.getElementById(`passHeim_${i}`).value = '';
            document.getElementById(`pHeim_${i}`).value = '';
            document.getElementById(`passGast_${i}`).value = '';
            document.getElementById(`pGast_${i}`).value = '';
            document.getElementById(`lHeim_${i}`).value = '';
            document.getElementById(`lGast_${i}`).value = '';
        }

        document.getElementById('blHighscore').value = '';
        document.getElementById('blHighfinish').value = '';
        document.getElementById('blShortEinzel').value = '';
        document.getElementById('blShortDoppel').value = '';

        calculateScores();
    }

    function saveReport() {
        let matches = [];
        for (let i = 1; i <= totalMatches; i++) {
            matches.push({
                nr: i,
                passHeim: document.getElementById(`passHeim_${i}`).value,
                pHeim: document.getElementById(`pHeim_${i}`).value,
                passGast: document.getElementById(`passGast_${i}`).value,
                pGast: document.getElementById(`pGast_${i}`).value,
                lHeim: document.getElementById(`lHeim_${i}`).value,
                lGast: document.getElementById(`lGast_${i}`).value,
                zsLegs: document.getElementById(`zsLegs_${i}`).textContent,
                zsSpstd: document.getElementById(`zsSpstd_${i}`).textContent
            });
        }

        const payload = {
            sheetName: SHEET_NAME,
            action: "saveNwdvReport",
            head: {
                datum: document.getElementById('datum').value,
                spieltag: document.getElementById('spieltag').value,
                liga: document.getElementById('liga').value,
                spielort: document.getElementById('spielort').value,
                heim: document.getElementById('teamHeim').value,
                gast: document.getElementById('teamGast').value
            },
            finalScore: document.getElementById('endstand_block3_spiele').textContent,
            finalLegs: document.getElementById('endstand_block3_legs').textContent,
            bestleistungen: {
                highscore: document.getElementById('blHighscore').value,
                highfinish: document.getElementById('blHighfinish').value,
                shortEinzel: document.getElementById('blShortEinzel').value,
                shortDoppel: document.getElementById('blShortDoppel').value
            },
            matches: matches
        };

        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        }).then(() => {
            alert("NWDV-Spielbericht erfolgreich übermittelt!");
            setTimeout(loadReportsFromSheet, 1500);
        });
    }

    initForm();
</script>
</body>
</html>
