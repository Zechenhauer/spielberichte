<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NWDV Spielbericht Typ A</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --success: #22c55e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 900px;
        }

        h2 { color: var(--accent); text-align: center; margin-top: 10px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        
        .form-group { margin-bottom: 10px; }
        label { display: block; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 3px; }
        input, select { width: 100%; padding: 8px; background: #0f172a; border: 1px solid var(--border-color); border-radius: 6px; color: white; box-sizing: border-box; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.85rem; }
        th, td { border: 1px solid var(--border-color); padding: 6px; text-align: center; }
        th { background: #0f172a; color: var(--accent); }
        .score-input { width: 45px !important; text-align: center; }
        .running-score { font-weight: bold; color: var(--success); }
        
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; background: var(--success); color: white; margin-top: 20px; font-size: 1rem; }
        button:hover { opacity: 0.9; }
        .block-header { background: #334155; color: #fff; text-align: left; padding: 6px 10px; font-weight: bold; margin-top: 20px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h2>NWDV Ligaspielbericht "Typ A"</h2>
    
    <div class="grid-4">
        <div class="form-group"><label>Datum</label><input type="date" id="datum"></div>
        <div class="form-group"><label>Spieltag</label><input type="number" id="spieltag" value="1"></div>
        <div class="form-group"><label>Liga</label><input type="text" id="liga" value="NWDV Liga A"></div>
        <div class="form-group"><label>Spielort</label><input type="text" id="spielort" placeholder="Vereinsheim"></div>
    </div>
    
    <div class="grid-2">
        <div class="form-group"><label>Heimmannschaft</label><input type="text" id="teamHeim" value="TV Kapellen"></div>
        <div class="form-group"><label>Gastmannschaft</label><input type="text" id="teamGast" placeholder="Gegner Name"></div>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width:30px;">#</th>
                <th>Heim Spieler</th>
                <th>Gast Spieler</th>
                <th style="width:90px;">Legs</th>
                <th style="width:110px;">Zwischenstand (Legs)</th>
                <th style="width:110px;">Zwischenstand (Spstd.)</th>
            </tr>
        </thead>
        <tbody id="matchTableBody"></tbody>
    </table>

    <div class="block-header">Bestleistungen</div>
    <div class="grid-2" style="margin-top: 10px;">
        <div class="form-group"><label>Highscore (180)</label><input type="text" id="blHighscore" placeholder="Spieler Name(n)"></div>
        <div class="form-group"><label>Highfinish (100+)</label><input type="text" id="blHighfinish" placeholder="z.B. 120 (Max)"></div>
        <div class="form-group"><label>Shortgame Einzel</label><input type="text" id="blShortEinzel" placeholder="z.B. 15 Darts"></div>
        <div class="form-group"><label>Shortgame Doppel</label><input type="text" id="blShortDoppel" placeholder="z.B. 18 Darts"></div>
    </div>

    <button onclick="saveReport()">Spielbericht Speichern</button>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwmQzZgiasZFG-nb0TpnzRrqR5dm13fuPqsXJIf4IYfk4zIdrBCme6tI8axB-stUfM/exec";
    const totalMatches = 20;

    function buildTable() {
        const tbody = document.getElementById('matchTableBody');
        tbody.innerHTML = '';

        for (let i = 1; i <= totalMatches; i++) {
            if (i === 1) addBlockHeader(tbody, "Block 1: Einzel (1 - 8)");
            if (i === 9) addBlockHeader(tbody, "Block 2: Doppel (9 - 12)");
            if (i === 13) addBlockHeader(tbody, "Block 3: Einzel (13 - 20)");

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b>${i}</b></td>
                <td><input type="text" id="pHeim_${i}" placeholder="Spieler Heim"></td>
                <td><input type="text" id="pGast_${i}" placeholder="Spieler Gast"></td>
                <td>
                    <input type="number" class="score-input" id="lHeim_${i}" min="0" oninput="calculateScores()"> :
                    <input type="number" class="score-input" id="lGast_${i}" min="0" oninput="calculateScores()">
                </td>
                <td class="running-score" id="zsLegs_${i}">-</td>
                <td class="running-score" id="zsSpstd_${i}">-</td>
            `;
            tbody.appendChild(tr);
        }
    }

    function addBlockHeader(tbody, text) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td colspan="6" style="background:#1e293b; text-align:left; font-weight:bold; color:#3b82f6;">${text}</td>`;
        tbody.appendChild(tr);
    }

    function calculateScores() {
        let cumHeimLegs = 0;
        let cumGastLegs = 0;
        let cumHeimGames = 0;
        let cumGastGames = 0;

        for (let i = 1; i <= totalMatches; i++) {
            const hLegsVal = document.getElementById(`lHeim_${i}`).value;
            const gLegsVal = document.getElementById(`lGast_${i}`).value;

            if (hLegsVal !== '' && gLegsVal !== '') {
                const hLegs = parseInt(hLegsVal, 10) || 0;
                const gLegs = parseInt(gLegsVal, 10) || 0;

                cumHeimLegs += hLegs;
                cumGastLegs += gLegs;

                if (hLegs > gLegs) {
                    cumHeimGames += 1;
                } else if (gLegs > hLegs) {
                    cumGastGames += 1;
                }

                document.getElementById(`zsLegs_${i}`).textContent = `${cumHeimLegs} : ${cumGastLegs}`;
                document.getElementById(`zsSpstd_${i}`).textContent = `${cumHeimGames} : ${cumGastGames}`;
            } else {
                document.getElementById(`zsLegs_${i}`).textContent = `-`;
                document.getElementById(`zsSpstd_${i}`).textContent = `-`;
            }
        }
    }

    function saveReport() {
        let matches = [];
        for (let i = 1; i <= totalMatches; i++) {
            matches.push({
                nr: i,
                pHeim: document.getElementById(`pHeim_${i}`).value,
                pGast: document.getElementById(`pGast_${i}`).value,
                lHeim: document.getElementById(`lHeim_${i}`).value,
                lGast: document.getElementById(`lGast_${i}`).value,
                zsLegs: document.getElementById(`zsLegs_${i}`).textContent,
                zsSpstd: document.getElementById(`zsSpstd_${i}`).textContent
            });
        }

        const payload = {
            action: "saveNwdvReport",
            head: {
                datum: document.getElementById('datum').value,
                spieltag: document.getElementById('spieltag').value,
                liga: document.getElementById('liga').value,
                spielort: document.getElementById('spielort').value,
                heim: document.getElementById('teamHeim').value,
                gast: document.getElementById('teamGast').value
            },
            finalScore: document.getElementById(`zsSpstd_20`).textContent,
            finalLegs: document.getElementById(`zsLegs_20`).textContent,
            bestleistungen: {
                highscore: document.getElementById('blHighscore').value,
                highfinish: document.getElementById('blHighfinish').value,
                shortEinzel: document.getElementById('blShortEinzel').value,
                shortDoppel: document.getElementById('blShortDoppel').value
            },
            matches: matches
        };

        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        }).then(() => {
            alert("NWDV-Spielbericht erfolgreich in das neue Sheet übertragen!");
        });
    }

    buildTable();
</script>
</body>
</html>
