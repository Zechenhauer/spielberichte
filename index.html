<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Kapellen 1919 e.V. 3 - MF Kaderplanung</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --navy: #050a14;
            --gold: #D4AF37;
            --gold-dim: rgba(212, 175, 55, 0.1);
            --white: #ffffff;
            --card-bg: #0c1626;
            --accent-blue: #0074D9;
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
            --zusage: #10b981;
            --absage: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000; color: var(--text-main); font-family: 'Lato', sans-serif; padding: 20px; }
        
        .container {
            background-color: var(--navy);
            border: 1px solid var(--gold-dim);
            border-radius: 12px;
            padding: 30px;
            max-width: 1000px;
            margin: 0 auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        h2 { font-family: 'Poppins', sans-serif; color: var(--gold); text-align: center; margin-top: 0; font-size: 1.8rem; margin-bottom: 20px; }
        
        .role-box {
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid var(--gold);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
            color: var(--gold);
            font-size: 1.1rem;
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 6px; font-weight: bold; letter-spacing: 1px; }
        input, select { width: 100%; padding: 12px; background: #000; border: 1px solid #333; border-radius: 6px; color: white; font-size: 0.95rem; }
        input:focus, select:focus { border-color: var(--gold); outline: none; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: var(--card-bg); border-radius: 8px; overflow: hidden; }
        th, td { border: 1px solid rgba(255,255,255,0.05); padding: 10px; text-align: center; font-size: 0.9rem; }
        th { background: rgba(255,255,255,0.03); color: var(--gold); font-family: 'Poppins'; text-transform: uppercase; font-size: 0.8rem; }
        
        .block-header { background: rgba(212, 175, 55, 0.15); color: var(--gold); text-align: left; padding: 10px 15px; font-weight: bold; font-family: 'Poppins'; }
        
        .double-selects { display: flex; gap: 5px; }
        .double-selects select { flex: 1; }

        .save-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            background: var(--gold);
            color: #000;
            margin-top: 25px;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: opacity 0.2s;
        }
        .save-btn:hover { opacity: 0.9; }

        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover { color: var(--gold); }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Zurück zum Haupt-Dashboard</a>
    <h2>TV Kapellen 1919 e.V. 3<br><span style="font-size: 1.1rem; color: var(--text-dim);">MF Kaderplanung (8 Einzel / 4 Doppel)</span></h2>
    
    <div class="role-box" id="roleDisplay">Eingeloggt als: Lade...</div>

    <!-- Spieltag-Auswahl -->
    <div class="form-group" style="background: rgba(255,255,255,0.02); padding: 15px; border: 1px solid var(--gold-dim); border-radius: 8px;">
        <label style="color: var(--gold);">Spieltag aus offiziellem Spielplan wählen</label>
        <select id="scheduleSelect" onchange="applyScheduleSelection()">
            <option value="">-- Bitte Spieltag wählen --</option>
        </select>
    </div>

    <div class="grid-4">
        <div class="form-group"><label>Datum</label><input type="date" id="datum"></div>
        <div class="form-group"><label>Spieltag</label><input type="number" id="spieltagNummer" value="1"></div>
        <div class="form-group"><label>Liga</label><input type="text" id="liga" value="Bezirksklasse 05"></div>
        <div class="form-group"><label>Spielort</label><input type="text" id="spielort" value="Jugendzentrum Henri"></div>
    </div>
    
    <div class="grid-2">
        <div class="form-group"><label>Heimmannschaft</label><input type="text" id="teamHeim" value="TV Kapellen 1919 e.V. 3"></div>
        <div class="form-group"><label>Gastmannschaft (Gegner)</label><input type="text" id="teamGast" placeholder="Gegner"></div>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 100px;">Spiel #</th>
                <th>Heim Spieler (TV Kapellen 3)</th>
                <th>Gast Spieler (Gegner)</th>
            </tr>
        </thead>
        <tbody id="matchTableBody">
            <!-- Wird dynamisch gefüllt -->
        </tbody>
    </table>

    <button class="save-btn" onclick="saveMyAufstellung()">Aufstellung im Sheet speichern</button>
</div>

<script>
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwDn_d9o-RWGVFUENrs3ZubfFHPvo2SSKzy0bY0uw4avjngv9l0zgfVDop5cfcm6AgKHg/exec';
    
    let currentUser = localStorage.getItem('tvk3_user_26_27_mobile') || "Jürgen Schützendorf";
    const cleanUser = currentUser.replace(' (TC 1)', '').replace(' (MF1)', '').replace(' (MF2)', '').trim();
    document.getElementById('roleDisplay').innerHTML = `Eingeloggt als: <span style="color:#fff;">${cleanUser}</span>`;

    const ourTeamRoster = [
        "Jürgen Schützendorf", "Markus Ginsel", "Lars Neutag", "Ludger Schledorn", 
        "Andreas Denner", "Niklas Weichert", "Dominik Helmke", "Markus Lenz", 
        "Thomas Kliver", "Wolfram Senger", "Michael Müller", "Florian Hartwich"
    ];

    const schedule = {
        "2026-09-05": "TV Kapellen 1919 e.V. 2",
        "2026-09-18": "DSC Goch 3",
        "2026-09-25": "Rumelner TV 3",
        "2026-10-10": "DSC Goch 4",
        "2026-10-23": "Triple Inn Issum 2",
        "2026-11-07": "SV Menzelen 1925",
        "2026-11-13": "Die Wardter Darter",
        "2026-11-27": "The Red Lions Xanten 1",
        "2027-01-09": "Hart am Draht",
        "2027-01-22": "TV Kapellen 1919 e.V. 2",
        "2027-02-06": "DSC Goch 3",
        "2027-02-19": "Rumelner TV 3",
        "2027-03-05": "DSC Goch 4",
        "2027-03-13": "Triple Inn Issum 2",
        "2027-04-02": "SV Menzelen 1925",
        "2027-04-24": "Die Wardter Darter",
        "2027-05-08": "The Red Lions Xanten 1",
        "2027-05-14": "Hart am Draht"
    };

    function populateScheduleSelect() {
        const scheduleSelect = document.getElementById('scheduleSelect');
        let index = 1;
        for (const [date, team] of Object.entries(schedule)) {
            const option = document.createElement('option');
            option.value = date;
            option.dataset.spieltag = index;
            option.dataset.team = team;
            option.textContent = `Spieltag ${index} (${date}): vs. ${team}`;
            scheduleSelect.appendChild(option);
            index++;
        }
    }

    function applyScheduleSelection() {
        const scheduleSelect = document.getElementById('scheduleSelect');
        const selectedOption = scheduleSelect.options[scheduleSelect.selectedIndex];
        if (!selectedOption.value) return;

        document.getElementById('datum').value = selectedOption.value;
        document.getElementById('spieltagNummer').value = selectedOption.dataset.spieltag;
        
        const opponent = selectedOption.dataset.team;
        document.getElementById('teamGast').value = opponent;
    }

    function buildMinimalTable() {
        const tbody = document.getElementById('matchTableBody');
        tbody.innerHTML = '';

        // Block 1: Einzel (1 - 8)
        const headerE = document.createElement('tr');
        headerE.innerHTML = `<td colspan="3" class="block-header">Block 1: Einzel (1 - 8)</td>`;
        tbody.appendChild(headerE);

        for(let i = 1; i <= 8; i++) {
            tbody.appendChild(createSingleRow(`Einzel ${i}`, i));
        }

        // Block 2: Doppel (1 - 4)
        const headerD = document.createElement('tr');
        headerD.innerHTML = `<td colspan="3" class="block-header">Block 2: Doppel (1 - 4)</td>`;
        tbody.appendChild(headerD);

        for(let i = 1; i <= 4; i++) {
            tbody.appendChild(createDoubleClickRow(`Doppel ${i}`, i + 8));
        }
    }

    function createSingleRow(label, index) {
        const tr = document.createElement('tr');
        let optionsHeim = '<option value="">-- Spieler --</option>';
        ourTeamRoster.forEach(p => { optionsHeim += `<option value="${p}">${p}</option>`; });

        tr.innerHTML = `
            <td><b>${label}</b></td>
            <td><select id="heim_${index}">${optionsHeim}</select></td>
            <td><input type="text" id="gast_${index}" placeholder="Gegner Spieler"></td>
        `;
        return tr;
    }

    function createDoubleClickRow(label, index) {
        const tr = document.createElement('tr');
        let optionsHeim1 = '<option value="">-- Spieler 1 --</option>';
        let optionsHeim2 = '<option value="">-- Spieler 2 --</option>';
        ourTeamRoster.forEach(p => { 
            optionsHeim1 += `<option value="${p}">${p}</option>`;
            optionsHeim2 += `<option value="${p}">${p}</option>`;
        });

        tr.innerHTML = `
            <td><b>${label}</b></td>
            <td>
                <div class="double-selects">
                    <select id="heim_${index}_a">${optionsHeim1}</select>
                    <select id="heim_${index}_b">${optionsHeim2}</select>
                </div>
            </td>
            <td>
                <div class="double-selects">
                    <input type="text" id="gast_${index}_a" placeholder="Gegner 1">
                    <input type="text" id="gast_${index}_b" placeholder="Gegner 2">
                </div>
            </td>
        `;
        return tr;
    }

    function saveMyAufstellung() {
        let matchData = [];
        // 8 Einzel + 4 Doppel = 12 Spiele insgesamt
        for(let i = 1; i <= 12; i++) {
            if (i <= 8) {
                matchData.push({
                    spiel: `Einzel ${i}`,
                    heim: document.getElementById(`heim_${i}`).value,
                    gast: document.getElementById(`gast_${i}`).value
                });
            } else {
                matchData.push({
                    spiel: `Doppel ${i-8}`,
                    heim: `${document.getElementById(`heim_${i}_a`).value} & ${document.getElementById(`heim_${i}_b`).value}`,
                    gast: `${document.getElementById(`gast_${i}_a`).value} & ${document.getElementById(`gast_${i}_b`).value}`
                });
            }
        }

        const payloadData = {
            spieltag: document.getElementById('spieltagNummer').value,
            datum: document.getElementById('datum').value,
            gegner: document.getElementById('teamGast').value,
            aufstellung: matchData
        };

        const url = new URL(GOOGLE_SCRIPT_URL);
        url.searchParams.append("action", "saveNwdvAufstellung");
        url.searchParams.append("spieler", cleanUser);
        url.searchParams.append("spieltag", document.getElementById('spieltagNummer').value);
        url.searchParams.append("payload", JSON.stringify(payloadData));

        const img = new Image();
        img.src = url.toString();

        alert("Aufstellung für Spieltag " + document.getElementById('spieltagNummer').value + " erfolgreich gespeichert!");
    }

    populateScheduleSelect();
    buildMinimalTable();
</script>
</body>
</html>
